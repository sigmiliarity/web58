<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Σ Music</title>
  <link rel="icon" href="placeholder.svg" />

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="ambient-bg"></div>
  <canvas id="visualizer"></canvas>

  <main class="container">
    <header>
      <h1>Σ Music <span>∞</span></h1>
      <p id="status">Loading ecosystem...</p>
    </header>

    <div class="toolbar">
      <div class="search-wrapper">
        <input id="search" type="search" placeholder="Search artists, tracks, albums..." autocomplete="off">
      </div>
      <button id="random" class="btn icon-btn" title="Play Random Track">🎲</button>
      <button id="current" class="btn icon-btn" title="Open Current Album">🔊</button>
    </div>

    <div id="results"></div>
  </main>

  <dialog id="viewer-dialog">
    <div class="dialog-container">
      <button id="close-dialog" class="close-dialog">✕ Close</button>
      <div id="dialog-content"></div>
    </div>
  </dialog>

  <div id="player-panel">
    <div class="player-layout">
      <div class="player-controls">
        <button class="control-btn" id="prev-track">Prev</button>
        <button class="control-btn" id="play-toggle">Play</button>
        <button class="control-btn" id="next-track">Next</button>
      </div>
      <div class="progress-container">
        <span class="time-display" id="time-current">0:00</span>
        <div class="progress-slider" id="seek-slider">
          <div class="progress-bar" id="fill-bar"></div>
        </div>
        <span class="time-display" id="time-total">0:00</span>
      </div>
    </div>
  </div>

  <audio crossorigin="anonymous" id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
